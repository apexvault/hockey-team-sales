name: CI

# Mandatory CI (P0-INF-1).
#
# Before this existed, nothing ran install/lint/test/build on push or PR. That
# is why a production build broken by an undeclared dependency and an entirely
# non-functional test suite both shipped to `main` unnoticed. Every job below
# exists to make one of those classes of failure impossible to miss again.
#
# The design rule throughout is FAIL CLOSED: a job that is skipped, cancelled,
# or produces no output must not be reportable as success. See the `verify` job.

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "develop"

# Supersede in-flight runs for the same ref. Never cancel `main` / release
# pushes -- those runs are the record of what landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. No job here writes to the repository, and nothing needs the
# token beyond checkout of a public ref.
permissions:
  contents: read

env:
  # Standard CI marker; makes tooling pick non-interactive defaults.
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the toolchain ONCE from the repository's own pinned values, so no
  # job can drift onto a different Node or pnpm than the lockfile was built for.
  # ---------------------------------------------------------------------------
  toolchain:
    name: Resolve pinned toolchain
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.pins.outputs.node-version }}
      pnpm-version: ${{ steps.pins.outputs.pnpm-version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - id: pins
        name: Read pinned versions from package.json
        run: |
          set -euo pipefail

          # packageManager is the single source of truth for pnpm.
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"

          # engines.node is a RANGE ("^20.19.0 || >=22.12.0"), so CI must pick a
          # concrete version. Pinning it here keeps runs deterministic; the
          # guard below fails loudly if the repo's range ever stops allowing it,
          # rather than letting CI drift onto an unsupported runtime.
          NODE_VERSION="22.12.0"
          EXPECTED_RANGE="^20.19.0 || >=22.12.0"
          ACTUAL_RANGE="$(node -p "require('./package.json').engines.node")"

          if [ "${ACTUAL_RANGE}" != "${EXPECTED_RANGE}" ]; then
            echo "::error::engines.node changed to '${ACTUAL_RANGE}' (expected '${EXPECTED_RANGE}')."
            echo "::error::Re-pin NODE_VERSION in .github/workflows/ci.yml and update EXPECTED_RANGE."
            exit 1
          fi

          echo "pnpm-version=${PNPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "node-version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Node ${NODE_VERSION}, pnpm ${PNPM_VERSION}"

  # ---------------------------------------------------------------------------
  # Lint. Cheapest signal, so it runs independently of the heavier jobs.
  #
  # NOTE: there is deliberately NO typecheck step, because the repository has no
  # typecheck script -- `tsc --noEmit` currently reports two pre-existing errors
  # unrelated to any recent change. Adding it here would make CI red on arrival
  # and train people to ignore it. Adding the script and fixing those two errors
  # is P0-INF-2; this workflow gains a typecheck job at that point.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ needs.toolchain.outputs.pnpm-version }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ needs.toolchain.outputs.node-version }}
          # Keyed on the lockfile. A lockfile change invalidates the cache, so a
          # stale store can never satisfy a changed dependency graph.
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        env:
          # `next lint` runs apps/storefront/check-env-variables.js first, which
          # hard-fails on a missing publishable key. Lint makes no network call,
          # so a placeholder is sufficient -- but without it the job fails for a
          # reason that has nothing to do with lint. A local .env.local hid this
          # until CI ran.
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_lint_placeholder
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_BASE_URL: http://localhost:8000
        run: pnpm lint

  # ---------------------------------------------------------------------------
  # Unit tests. No database required.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ needs.toolchain.outputs.pnpm-version }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ needs.toolchain.outputs.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: apps/backend
        env:
          TEST_TYPE: unit
          NODE_OPTIONS: --experimental-vm-modules
        # `--passWithNoTests` is deliberately NOT set. An empty run is a
        # failure, because "no tests found" is exactly how a suite silently
        # stops protecting anything.
        run: |
          npx jest --ci --runInBand --forceExit             --json --outputFile="${RUNNER_TEMP}/unit-results.json"

      - name: Enforce unit test floor
        if: always()
        working-directory: apps/backend
        env:
          # Floor, not an exact count, so adding tests never breaks CI -- but
          # DELETING tests to get green does. Raise this when the suite grows.
          MIN_UNIT_TESTS: "28"
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/unit-results.json';
            if (!fs.existsSync(path)) {
              console.error('::error::No unit test results were produced.');
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const min = Number(process.env.MIN_UNIT_TESTS);
            const skipped = (r.numPendingTests || 0) + (r.numTodoTests || 0);
            console.log('unit: ' + r.numPassedTests + ' passed, ' + r.numTotalTests + ' total, ' + skipped + ' skipped/todo');
            if (!r.success) { console.error('::error::Unit suite reported failure.'); process.exit(1); }
            // Count PASSED, not total. numTotalTests includes pending and todo,
            // and jest reports success:true when tests are skipped -- so gating
            // on the total lets a five-character 'describe.skip' silently
            // disable a suite while the floor still appears satisfied.
            if (r.numPassedTests < min) {
              console.error('::error::Unit PASSED count ' + r.numPassedTests + ' is below the floor of ' + min + '. Tests were removed, skipped, or did not run.');
              process.exit(1);
            }
            // Skipping is never acceptable in CI. Quarantine belongs in a
            // tracked task, not an invisible edit.
            if (skipped > 0) {
              console.error('::error::' + skipped + ' unit test(s) are skipped or todo. CI does not accept skipped tests.');
              process.exit(1);
            }
          "

  # ---------------------------------------------------------------------------
  # Migrations from an EMPTY database, then the integration suite against it.
  # ---------------------------------------------------------------------------
  integration:
    name: Migrations + integration tests
    needs: toolchain
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hockey_ci
        ports:
          - 5432:5432
        # Without a health gate the first migration races container startup and
        # fails intermittently -- which trains people to re-run red builds.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hockey_ci
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: hockey_ci
      # The integration specs inject this exact value into the app under test
      # (`env: { JWT_SECRET: "supersecret" }`), and the admin token helper signs
      # with process.env.JWT_SECRET -- they must match or every request 401s.
      # This is a throwaway CI value for an ephemeral database, not a secret.
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000

    steps:
      # Job-level `env` is echoed by the runner in every step's env group, so
      # the throwaway signing key would appear in plaintext dozens of times in a
      # public log. The value grants nothing (ephemeral container), but printing
      # a JWT secret is a pattern worth not normalising.
      - name: Mask CI-only secrets
        run: echo "::add-mask::supersecret"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ needs.toolchain.outputs.pnpm-version }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ needs.toolchain.outputs.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Confirm the database is empty before migrating
        run: |
          set -euo pipefail
          TABLES="$(PGPASSWORD=postgres psql -h localhost -U postgres -d hockey_ci -t -A \
            -c "select count(*) from information_schema.tables where table_schema='public';")"
          echo "Pre-migration public tables: ${TABLES}"
          if [ "${TABLES}" != "0" ]; then
            echo "::error::Database was not empty before migrating; 'from empty' is unproven."
            exit 1
          fi

      - name: Run migrations from empty
        working-directory: apps/backend
        run: npx medusa db:migrate

      - name: Assert migrations actually created the schema
        run: |
          set -euo pipefail
          TABLES="$(PGPASSWORD=postgres psql -h localhost -U postgres -d hockey_ci -t -A \
            -c "select count(*) from information_schema.tables where table_schema='public';")"
          echo "Post-migration public tables: ${TABLES}"
          # A migration command can exit 0 having done nothing. Require evidence.
          if [ "${TABLES}" -lt 100 ]; then
            echo "::error::Expected >=100 tables after migration, found ${TABLES}."
            exit 1
          fi
          for t in company employee quote message approval approval_settings approval_status; do
            FOUND="$(PGPASSWORD=postgres psql -h localhost -U postgres -d hockey_ci -t -A \
              -c "select count(*) from information_schema.tables where table_schema='public' and table_name='${t}';")"
            if [ "${FOUND}" != "1" ]; then
              echo "::error::Custom module table '${t}' missing after migration."
              exit 1
            fi
          done
          echo "All custom module tables present."

      - name: Run integration tests
        working-directory: apps/backend
        env:
          TEST_TYPE: integration:http
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npx jest --ci --runInBand --forceExit             --json --outputFile="${RUNNER_TEMP}/integration-results.json"

      - name: Enforce integration test floor
        if: always()
        working-directory: apps/backend
        env:
          MIN_INTEGRATION_TESTS: "76"
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/integration-results.json';
            if (!fs.existsSync(path)) {
              console.error('::error::No integration test results were produced.');
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const min = Number(process.env.MIN_INTEGRATION_TESTS);
            const skipped = (r.numPendingTests || 0) + (r.numTodoTests || 0);
            console.log('integration: ' + r.numPassedTests + ' passed, ' + r.numTotalTests + ' total, ' + skipped + ' skipped/todo');
            if (!r.success) { console.error('::error::Integration suite reported failure.'); process.exit(1); }
            // Count PASSED, not total. numTotalTests includes pending and todo,
            // and jest reports success:true when tests are skipped -- so gating
            // on the total lets a five-character 'describe.skip' silently
            // disable a suite while the floor still appears satisfied.
            if (r.numPassedTests < min) {
              console.error('::error::Integration PASSED count ' + r.numPassedTests + ' is below the floor of ' + min + '. Tests were removed, skipped, or did not run.');
              process.exit(1);
            }
            // Skipping is never acceptable in CI. Quarantine belongs in a
            // tracked task, not an invisible edit.
            if (skipped > 0) {
              console.error('::error::' + skipped + ' integration test(s) are skipped or todo. CI does not accept skipped tests.');
              process.exit(1);
            }
          "

  # ---------------------------------------------------------------------------
  # Production builds for BOTH apps.
  #
  # The storefront build performs build-time data collection against the backend
  # and fails with ECONNREFUSED if it is not running, so the backend is built,
  # migrated and started first. This is the constraint that made the original
  # broken build invisible.
  # ---------------------------------------------------------------------------
  build:
    name: Production builds
    needs: toolchain
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hockey_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hockey_build
      DB_NAME: hockey_build
      JWT_SECRET: ci-build-only-not-a-secret
      COOKIE_SECRET: ci-build-only-not-a-secret
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ needs.toolchain.outputs.pnpm-version }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ needs.toolchain.outputs.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate (seeds the publishable key the storefront build needs)
        working-directory: apps/backend
        run: npx medusa db:migrate

      - name: Build backend
        working-directory: apps/backend
        run: pnpm build

      - name: Start backend and capture its publishable key
        id: backend
        working-directory: apps/backend
        run: |
          set -euo pipefail
          # `medusa develop`, not `medusa start`. In Medusa v2 `medusa build`
          # emits a standalone deployable at .medusa/server, and `medusa start`
          # expects to be run FROM that directory -- run from the project root
          # it cannot find the admin build and exits with
          # "Could not find index.html in the admin build directory".
          # The storefront build only needs a reachable backend, and the
          # production build itself is already verified by the `Build backend`
          # step plus the artefact assertion below. Exercising the standalone
          # start path belongs to the staging deployment task (P1-REL-1).
          npx medusa develop > "${RUNNER_TEMP}/medusa.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/medusa.pid"

          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "Backend ready after ${i} attempts."
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Backend did not become ready."
              # Surface the tail so a failure is diagnosable without artifacts.
              tail -50 "${RUNNER_TEMP}/medusa.log" || true
              exit 1
            fi
            sleep 2
          done

          KEY="$(PGPASSWORD=postgres psql -h localhost -U postgres -d hockey_build -t -A \
            -c "select token from api_key where type='publishable' limit 1;")"
          if [ -z "${KEY}" ]; then
            echo "::error::No publishable key found; the storefront build cannot run."
            exit 1
          fi
          # Masked so it can never surface in logs, even though it is a
          # throwaway key for an ephemeral database.
          echo "::add-mask::${KEY}"
          echo "publishable-key=${KEY}" >> "$GITHUB_OUTPUT"

          # /health only proves the process is listening. Every build-time data
          # path in the storefront swallows errors -- generateStaticParams
          # catches and returns [], getRegion catches and returns null -- so a
          # backend answering /health while returning 500 on store endpoints
          # would still produce a BUILD_ID and a green job, prerendering nothing.
          # Require the store API to actually serve data before building.
          REGIONS="$(curl -sf -H "x-publishable-api-key: ${KEY}"             http://localhost:9000/store/regions || echo '')"
          COUNT="$(printf '%s' "${REGIONS}" | node -e "
            let s='';
            process.stdin.on('data', d => s += d);
            process.stdin.on('end', () => {
              try {
                const r = JSON.parse(s);
                process.stdout.write(String((r.regions || []).length));
              } catch { process.stdout.write('0'); }
            });
          ")"
          echo "Store API returned ${COUNT} region(s)."
          if [ "${COUNT}" = "0" ]; then
            echo "::error::Backend is listening but its store API returned no regions; the storefront build would silently prerender nothing."
            tail -50 "${RUNNER_TEMP}/medusa.log" || true
            exit 1
          fi

      - name: Build storefront
        working-directory: apps/storefront
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ steps.backend.outputs.publishable-key }}
          NEXT_PUBLIC_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_DEFAULT_REGION: us
        run: pnpm build

      - name: Assert both build outputs exist
        run: |
          set -euo pipefail
          # `turbo` can report success from cache; require the artefacts.
          test -d apps/backend/.medusa/server || { echo "::error::backend .medusa/server missing"; exit 1; }
          test -f apps/storefront/.next/BUILD_ID || { echo "::error::storefront .next/BUILD_ID missing"; exit 1; }
          echo "Both build outputs present."

      - name: Stop backend
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/medusa.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/medusa.pid")" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Fail-closed gate.
  #
  # This is the ONLY job a branch protection rule should require. A required job
  # that is skipped or cancelled is reported by GitHub as neither failure nor
  # success, and a rule naming the individual jobs can therefore go green when
  # they never ran. This job demands an explicit `success` from each.
  # ---------------------------------------------------------------------------
  verify:
    name: CI passed
    if: always()
    needs: [toolchain, lint, unit, integration, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"

          # The job list is derived from the `needs` context itself -- never
          # restated here. A second hard-coded list silently stops covering any
          # job added to `needs` but forgotten in the loop, and that job could
          # then fail while this gate reports success.
          node -e "
            const needs = JSON.parse(process.env.RESULTS);
            const jobs = Object.keys(needs);

            if (jobs.length === 0) {
              console.error('::error::No upstream jobs found in the needs context.');
              process.exit(1);
            }

            let failed = false;
            for (const job of jobs) {
              const result = (needs[job] && needs[job].result) || 'missing';
              console.log(job + ': ' + result);
              if (result !== 'success') {
                console.error('::error::Required job ' + job + ' did not succeed (result: ' + result + ').');
                failed = true;
              }
            }

            if (failed) { process.exit(1); }
            console.log('All ' + jobs.length + ' required jobs succeeded.');
          "
